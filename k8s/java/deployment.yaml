apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-service
  labels:
    app: weather-service
    version: "0.0.1-SNAPSHOT"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-service
  template:
    metadata:
      labels:
        app: weather-service
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: weather-service
          image: us-central1-docker.pkg.dev/weatherapp-gke/weather-service-repo/weather-service:1.1.1
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "production"
            # Dane z ConfigMap
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_DATASOURCE_URL
            - name: WEATHER_FILE_BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WEATHER_FILE_BASE_PATH
            - name: WEATHER_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WEATHER_API_BASE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: weather-data
              mountPath: /app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "812Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 10
      volumes:
        - name: weather-data
          persistentVolumeClaim:
            claimName: weather-data-pvc